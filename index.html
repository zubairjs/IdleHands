<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IdleHands</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./assets/IdleHands-favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div
      id="auth-panel"
      class="d-flex flex-column justify-content-center h-100 auth"
    >
      <div class="container rounded-4 p-5 w-75">
        <header class="text-center bg-transparent">
          <div
            class="logo container p-0 d-flex justify-content-center rounded-4 overflow-hidden"
          >
            <img class="logo w-100" src="./assets/logo.svg" alt="" />
          </div>
          <h1 class="m-3">Login</h1>
          <p class="small">Login to start being productive.</p>
        </header>
        <form class="d-flex flex-column gap-2 needs-validation" novalidate>
          <div class="has-validation">
            <label for="username" class="form-label small fw-semibold"
              >Username</label
            >
            <input
              type="text"
              class="form-control py-2 rounded-3"
              id="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
            <div class="invalid-feedback">Invalid username.</div>
          </div>
          <div class="has-validation">
            <label for="password" class="form-label small fw-semibold"
              >Password</label
            >
            <input
              type="password"
              class="form-control py-2 rounded-3"
              id="password"
              placeholder="Enter your password"
              required
            />
            <div class="invalid-feedback">Invalid password.</div>
          </div>
          <div class="has-validation d-none">
            <label for="password" class="form-label small fw-semibold"
              >Confirm Password</label
            >
            <input
              type="password"
              class="form-control py-2 rounded-3"
              id="confirm-password"
              placeholder="Enter your password"
              pattern="^[a-zA-Z0-9]+$"
              required
            />
            <div class="invalid-feedback">Invalid password.</div>
          </div>
          <p
            id="form-msg"
            class="m-0 small text-center text-danger rounded"
          ></p>
          <button type="submit" class="btn py-2 rounded-3 fw-semibold">
            Login
          </button>
        </form>
        <p id="toggle-auth" class="mt-3 text-center text-muted small">
          <span id="toggle-auth-text" class="">Not registered yet?</span>
          <button
            id="toggle-auth-btn"
            class="border-0 bg-transparent fw-bold text-dark-emphasis"
          >
            Sign Up
          </button>
        </p>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
